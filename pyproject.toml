[project]
name = "agentic-editor"
version = "0.1.0"
description = "Agentic local video editor — ASR, radio-edit EDL, Remotion compose"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "faster-whisper>=1.1.0",
  "pillow>=10.0.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "pytest>=8.0.0"]

[project.scripts]
ae = "agentic_editor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_editor"]

[tool.hatch.build.targets.wheel.sources]
"src/agentic_editor" = "agentic_editor"

[tool.uv]
package = true
